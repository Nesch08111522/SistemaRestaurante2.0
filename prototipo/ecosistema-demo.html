function reputationPage(){return `${head('Reputación y reseñas','Supervisa valoraciones verificadas, reportes y calidad de experiencia.')}<div class="grid four">${stat('Reseñas recibidas','8,420','En la plataforma','☆')}${stat('Promedio general','4.7 / 5','Valoraciones válidas','★')}${stat('Reportes abiertos','12','Pendientes de resolución','!')}${stat('Experiencias verificadas','91%','De las reseñas registradas','✓')}</div><div class="card pad" style="margin-top:15px">${tableHTML(['Negocio','Valoración','Reseñas','Reportes','Estado'],[['Sabor Norteño','4.9','640','1','<span class="pill good">Normal</span>'],['Café Origen','4.8','420','0','<span class="pill good">Normal</span>'],['Dulce Norte','3.9','86','4','<span class="pill warn">Revisar</span>']])}</div>`}
function globalAnalyticsPage(){return `${head('Analítica global','Indicadores del ecosistema y tendencias gastronómicas.',`<button class="btn" data-action="export">Exportar resumen</button>`)}<div class="grid four">${stat('Visitas verificadas','64,820','Este mes','⌖')}${stat('Pedidos completados','42,810','Este mes','▣')}${stat('Negocios activos','1,102','De 1,284 registrados','▧')}${stat('Satisfacción promedio','4.7 / 5','Reseñas verificadas','☆')}</div><div class="grid two" style="margin-top:15px"><div class="card pad"><h3>Negocios por actividad</h3>${barLine('Sabor Norteño',94,'2,480 visitas')}${barLine('Café Origen',78,'1,920 visitas')}${barLine('Brasa de Barrio',65,'1,640 visitas')}</div><div class="card pad"><h3>Categorías con mayor crecimiento</h3>${barLine('Comida marina',89,'+18%')}${barLine('Cafeterías',73,'+14%')}${barLine('Comida saludable',62,'+11%')}</div></div><div class="notice" style="margin-top:14px">Los rankings deben separar visitas verificadas, pedidos completados, reputación y popularidad por interacción. Un clic no equivale a una visita ni a una venta.</div>`}
function plansPage(){return `${head('Planes y suscripciones','Gestiona los niveles de servicio para negocios gastronómicos.')}<div class="rolecards"><div class="rolecard"><div class="eyebrow">ESENCIAL</div><h2 class="section-title" style="margin:10px 0">Básico</h2><div class="stat-value">S/ 49</div><p>Perfil público, carta digital, fotografías, QR informativo y estadísticas iniciales.</p><span class="pill">Presencia digital</span></div><div class="rolecard" style="border-color:rgba(86,214,192,.45)"><div class="eyebrow">GESTIÓN</div><h2 class="section-title" style="margin:10px 0">Intermedio</h2><div class="stat-value">S/ 99</div><p>Pedidos QR, mesas, cocina, inventario, clientes, Excel y web personalizable.</p><span class="pill good">Operación inteligente</span></div><div class="rolecard"><div class="eyebrow">AVANZADO</div><h2 class="section-title" style="margin:10px 0">Premium</h2><div class="stat-value">S/ 199</div><p>Copilot, voz, IA visual, predicción, automatización y experiencias 3D/AR.</p><span class="pill info">Ecosistema automatizado</span></div></div><p class="tiny muted" style="margin-top:13px">Precios y límites ilustrativos. Deben validarse costos de infraestructura, IA, almacenamiento, soporte y pasarelas.</p>`}
function integrationsPage(){return `${head('Integraciones','Conexiones externas y servicios que dan soporte al ecosistema.')}<div class="grid two">${integrationCard('PostgreSQL / Supabase','Base de datos transaccional','Conexión y almacenamiento','Requiere configuración')}${integrationCard('OpenRouter','Modelos de lenguaje e IA','Copilot y recomendaciones','Requiere API')}${integrationCard('Proveedor de mapas','Geocodificación y rutas','Mapa gastronómico','Requiere API y facturación')}${integrationCard('Web Push','Notificaciones a dispositivos','Avisos y recordatorios','Requiere HTTPS y VAPID')}${integrationCard('Pagos','Pasarela y webhooks','Cobros y devoluciones','Requiere certificación')}${integrationCard('Blockchain','Registro verificable de trazabilidad','Evidencias de lotes y procedencia','Diseño conceptual')}</div>`}
function integrationCard(name,desc,use,status){return `<div class="card pad"><div class="foodmeta"><h3 style="margin:0">${name}</h3><span class="pill warn">${status}</span></div><p class="muted small">${desc}</p><p class="small">${use}</p><button class="btn sm" data-action="integration-info">Detalles</button></div>`}
function auditPage(){return `${head('Auditoría y seguridad','Registro de eventos administrativos y operaciones sensibles.')}<div class="grid four">${stat('Eventos registrados','28,410','Periodo de demostración','◷')}${stat('Accesos sensibles','142','Con registro de responsable','♙')}${stat('Alertas','3','Requieren investigación','!')}${stat('Integridad de registros','100%','Estado de demostración','✓')}</div><div class="card pad" style="margin-top:15px">${tableHTML(['Fecha','Actor','Evento','Recurso','Resultado'],[['23 nov · 00:24','admin@smartresto','Aprobación de negocio','Dulce Norte','<span class="pill good">Correcto</span>'],['22 nov · 22:10','owner@sabor','Actualización de menú','Producto #SR-22','<span class="pill good">Correcto</span>'],['22 nov · 21:40','system','Alerta de intentos','Autenticación','<span class="pill warn">Revisar</span>']])}</div>`}
function adminSettingsPage(){return `${head('Configuración global','Políticas, categorías, cuotas, seguridad y funcionalidades del ecosistema.')}<div class="grid two"><div class="card pad"><h3>Políticas de publicación</h3><div class="grid" style="gap:10px"><label class="small"><input type="checkbox" checked> Requerir validación de propietario para precios</label><label class="small"><input type="checkbox" checked> Revisar fichas generadas por IA</label><label class="small"><input type="checkbox" checked> Conservar procedencia de datos</label><label class="small"><input type="checkbox" checked> Moderar contenido denunciado</label></div></div><div class="card pad"><h3>Capacidades del ecosistema</h3><div class="grid" style="gap:10px"><div class="foodmeta"><span>Marketplace</span><span class="pill good">Activo · Demo</span></div><div class="foodmeta"><span>Recomendaciones IA</span><span class="pill good">Activo · Demo</span></div><div class="foodmeta"><span>Menú 3D / AR</span><span class="pill warn">Planificado</span></div><div class="foodmeta"><span>Blockchain trazabilidad</span><span class="pill warn">Planificado</span></div></div></div></div>`}
function genericPage(){return `${head(titles[state.view]||'SmartResto','Vista del ecosistema en prototipo.')}<div class="empty"><div style="font-size:30px;margin-bottom:8px">✦</div><strong>Vista conceptual</strong><p class="small">Esta sección forma parte del mapa funcional del ecosistema. Se ampliará durante la implementación del producto.</p></div>`}
function publicForRole(){if(state.role==='public')return publicHome();return shell(routeContent())}
function routeContent(){switch(state.view){case'home':return comensalHome();case'discover':return discoverPage();case'map':return mapPage();case'recommend':return recommendPage();case'orders':return state.role==='empresario'?ordersBusinessPage():orderPage();case'favorites':return favoritesPage();case'history':return historyPage();case'kitchen-home':return kitchenHomePage();case'recipes':return recipesPage();case'points':return pointsPage();case'reviews':return reviewsPage();case'notifications':return notificationsPage();case'profile':return profilePage();case'dashboard':return empresarioDashboard();case'business':return businessPage();case'branches':return branchesPage();case'website':return websitePage();case'menu':return menuPage();case'qr':return qrPage();case'kitchen':return kitchenPage();case'flow':return flowPage();case'inventory':return inventoryPage();case'production':return productionPage();case'clients':return clientsPage();case'promotions':return promotionsPage();case'analytics':return analyticsPage();case'copilot':return copilotPage();case'import':return importPage();case'staff':return staffPage();case'settings':return settingsPage();case'admin-dashboard':return adminDashboard();case'users':case'admin-businesses':return adminTablePage(state.view);case'discovery-ai':return discoveryPage();case'moderation':return moderationPage();case'reputation':return reputationPage();case'global-analytics':return globalAnalyticsPage();case'plans':return plansPage();case'integrations':return integrationsPage();case'audit':return auditPage();case'admin-settings':return adminSettingsPage();default:return genericPage()}}
function render(){const root=$('#app');root.innerHTML=state.role==='public'?publicHome():shell(routeContent());renderModal();}
function actionHandler(action,el){switch(action){case'toggle-sidebar':state.sidebar=!state.sidebar;render();break;case'close-modal':closeModal();break;case'backdrop':if(el.target.classList.contains('modalback'))closeModal();break;case'modal-confirm':{const cb=state.modal?.callback;closeModal();if(cb)cb();else toast('Acción simulada correctamente');break}case'login':openModal('Iniciar sesión',`<div class="grid" style="gap:12px"><div class="field"><label>Correo electrónico</label><input placeholder="tu@correo.com"></div><div class="field"><label>Contraseña</label><input type="password" placeholder="••••••••"></div><p class="tiny muted">Acceso de demostración. No se valida contra usuarios reales.</p></div>`,'Continuar',()=>{setRole('comensal')});break;case'register':openModal('Crear cuenta SmartResto',`<div class="grid" style="gap:12px"><div class="field"><label>Nombre completo</label><input placeholder="Tu nombre"></div><div class="field"><label>Correo electrónico</label><input placeholder="tu@correo.com"></div><div class="field"><label>Quiero registrarme como</label><select id="register-role"><option value="comensal">Comensal</option><option value="empresario">Empresario</option></select></div></div>`,'Crear cuenta',()=>setRole($('#register-role')?.value||'comensal'));break;case'register-business':openModal('Registrar mi negocio',`<div class="grid" style="gap:12px"><div class="field"><label>Nombre del negocio</label><input placeholder="Ej. Sabor Norteño"></div><div class="field"><label>Tipo de negocio</label><select><option>Restaurante</option><option>Cafetería</option><option>Pastelería</option><option>Emprendimiento gastronómico</option><option>Delivery</option></select></div><div class="field"><label>Ubicación</label><input placeholder="Distrito y dirección"></div><p class="tiny muted">La IA puede preparar una ficha preliminar, pero el propietario deberá validar los datos y acreditar su relación con el negocio.</p></div>`,'Continuar',()=>setRole('empresario'));break;case'set-comensal':setRole('comensal');break;case'public-search':{const q=$('#public-search')?.value||'';state.search=q;setRole('comensal');state.view='discover';break}case'show-notifications':go('notifications');break;case'business-detail':openModal('Ficha de negocio — Sabor Norteño',`<div class="foodvisual warm" style="border-radius:12px;font-size:55px">🍲</div><h3>Sabor Norteño</h3><p>Restaurante de comida marina · Trujillo.</p><div class="tagrow"><span class="pill good">Abierto</span><span class="pill">★ 4.9</span><span class="pill">Delivery disponible</span></div><p>Consulta su carta, disponibilidad, ubicación y modalidades de atención.</p>`,'Ver carta',()=>{state.role='comensal';go('discover')});break;case'location-demo':toast('Solicitud de ubicación simulada. En producción se pedirá permiso al navegador.');break;case'scan-demo':openModal('Escaneo de despensa',`<p>La cámara permitiría reconocer alimentos y proponer ingredientes, cantidades y fechas de vencimiento. En este prototipo se simula el análisis.</p><div class="foodvisual green" style="border-radius:12px;font-size:55px">🥕</div><p><strong>Propuesta:</strong> zanahoria · 4 unidades · confianza visual ilustrativa.</p>`,'Agregar a despensa');break;case'add-ingredient':openModal('Agregar ingrediente',`<div class="formgrid"><div class="field"><label>Ingrediente</label><input placeholder="Ej. Tomate"></div><div class="field"><label>Cantidad</label><input placeholder="Ej. 500 g"></div></div>`,'Agregar');break;case'recipe-detail':openModal('Receta paso a paso — Arroz con pollo',`<ol><li>Sofríe la cebolla, ajo y culantro.</li><li>Agrega el pollo y cocina hasta sellar.</li><li>Incorpora arroz, verduras y líquido según la receta validada.</li><li>Cocina hasta alcanzar la textura deseada y verifica la cocción.</li></ol><p class="tiny muted">Receta de ejemplo. Cantidades y seguridad alimentaria deben verificarse para cada preparación.</p>`,'Guardar receta');break;case'rate':openModal('Valorar Sabor Norteño',`<p>¿Cómo estuvo tu experiencia?</p><div style="font-size:30px;display:flex;gap:12px;margin:12px 0"><button data-rate="1">😕</button><button data-rate="2">😐</button><button data-rate="3">🙂</button><button data-rate="4">🤩</button></div><div class="field"><label>Comentario</label><textarea placeholder="Cuéntanos qué te pareció..."></textarea></div>`,'Enviar valoración',()=>toast('Valoración de demostración registrada'));break;case'redeem':openModal('Confirmar canje',`<p>Se simulará el canje de una recompensa del programa SmartResto Rewards. En producción se verificará el saldo y las reglas del negocio.</p>`,'Confirmar canje',()=>toast('Canje simulado correctamente'));break;case'push-demo':openModal('Notificaciones push',`<p>Las notificaciones requieren HTTPS, registro de Service Worker, VAPID y un permiso explícito del navegador.</p><p class="tiny muted">Este archivo local no crea una suscripción ni envía notificaciones reales.</p>`,'Entendido');break;case'save':toast('Cambios guardados en la demostración');break;case'add-branch':openModal('Nueva sucursal',`<div class="grid" style="gap:10px"><div class="field"><label>Nombre</label><input placeholder="Sucursal nueva"></div><div class="field"><label>Dirección</label><input placeholder="Dirección y distrito"></div></div>`,'Crear sucursal');break;case'preview-site':openModal('Vista previa del sitio',`<div class="previewsite"><div class="previewhero"><div class="tiny">SABOR NORTEÑO</div><h2>Tradición norteña en cada plato.</h2><p>Sabores del mar y de nuestra tierra.</p></div><div class="previewcontent">Carta · Especialidades · Contacto</div></div>`,'Cerrar');break;case'add-dish':case'edit-dish':openModal(action==='add-dish'?'Registrar nuevo plato':'Editar producto',`<div class="grid" style="gap:10px"><div class="field"><label>Nombre del plato</label><input placeholder="Nombre comercial"></div><div class="field"><label>Precio</label><input type="number" placeholder="0.00"></div><div class="field"><label>Ingredientes declarados</label><textarea placeholder="Confirma ingredientes, cantidades y alérgenos..."></textarea></div><div class="field"><label>Disponibilidad</label><select><option>Disponible</option><option>Agotado</option><option>Temporalmente pausado</option></select></div></div>`,'Guardar borrador');break;case'qr-preview':openModal('Vista previa de carta QR',`<div class="previewsite"><div class="previewhero"><div class="tiny">SABOR NORTEÑO · MESA 08</div><h2>Carta digital</h2><p>Explora, elige y agrega al pedido.</p></div><div class="previewcontent"><div class="previewdish"><span class="emoji">🍤</span><span><b>Ceviche clásico</b><br><small>S/ 28.00</small></span><button class="btn sm">＋</button></div><div class="previewdish"><span class="emoji">🍛</span><span><b>Arroz con mariscos</b><br><small>S/ 32.00</small></span><button class="btn sm">＋</button></div></div></div>`,'Cerrar');break;case'create-qr':openModal('Generar código QR',`<div class="formgrid"><div class="field"><label>Sucursal</label><select><option>Principal</option><option>California</option></select></div><div class="field"><label>Piso</label><select><option>Segundo piso</option><option>Primer piso</option></select></div><div class="field"><label>Zona</label><select><option>Terraza</option><option>Salón</option></select></div><div class="field"><label>Mesa</label><input value="13"></div></div>`,'Generar QR');break;case'advance-order':toast('Estado del pedido actualizado en modo demostración');break;case'export':toast('Preparando exportación de demostración');break;case'waitlist-add':openModal('Agregar grupo a lista de espera',`<div class="formgrid"><div class="field"><label>Número de personas</label><input type="number" value="2"></div><div class="field"><label>Contacto</label><input placeholder="Teléfono o identificador"></div></div>`,'Registrar turno');break;case'flow-refresh':toast('Estado del salón actualizado en la demostración');break;case'notify-group':toast('Aviso de turno simulado');break;case'send-diner-prompt':openModal('Consultar a comensales activos',`<p>Enviar un mensaje voluntario a las sesiones que aceptaron avisos operativos:</p><blockquote>Tenemos clientes esperando. ¿Necesitas algo más para finalizar tu experiencia? Puedes pedir la cuenta o solicitar más tiempo.</blockquote><p class="tiny muted">El mensaje no establece un límite obligatorio de permanencia.</p>`,'Simular envío',()=>toast('Consulta simulada preparada'));break;case'stock-add':openModal('Registrar ingreso de inventario',`<div class="formgrid"><div class="field"><label>Ingrediente</label><input placeholder="Arroz"></div><div class="field"><label>Cantidad</label><input placeholder="5 kg"></div><div class="field"><label>Lote</label><input placeholder="Lote / referencia"></div><div class="field"><label>Fecha de vencimiento</label><input type="date"></div></div>`,'Registrar ingreso');break;case'production-photo':openModal('Registrar producción mediante fotografía',`<p>La IA podría sugerir un nombre, ingredientes y descripción. Para calcular producción es necesario confirmar cantidades, receta y unidades.</p><div class="foodvisual warm" style="border-radius:12px;font-size:60px">🍛</div><p><strong>Borrador sugerido:</strong> arroz con pollo · 10 porciones estimadas.</p>`,'Revisar borrador');break;case'add-recipe':openModal('Nueva receta',`<div class="grid" style="gap:10px"><div class="field"><label>Nombre</label><input placeholder="Nombre de la receta"></div><div class="field"><label>Rendimiento</label><input placeholder="Ej. 4 porciones"></div><div class="field"><label>Ingredientes y cantidades</label><textarea placeholder="Ingrediente · cantidad · unidad"></textarea></div></div>`,'Guardar receta');break;case'new-promo':openModal('Crear promoción',`<div class="grid" style="gap:10px"><div class="field"><label>Nombre</label><input placeholder="Nombre de campaña"></div><div class="field"><label>Beneficio</label><input placeholder="Ej. 10% de descuento"></div><div class="field"><label>Vigencia</label><input type="date"></div></div>`,'Guardar borrador');break;case'generate-campaign':toast('La propuesta de campaña se generaría con IA en la aplicación conectada');break;case'send-copilot':sendCopilot();break;case'download-template':toast('En la versión conectada se descargará una plantilla Excel');break;case'validate-file':{const f=$('#file-input')?.files?.[0];toast(f?`Archivo seleccionado: ${f.name}. Validación simulada`:'Selecciona primero un archivo');break}case'add-staff':openModal('Invitar empleado',`<div class="grid" style="gap:10px"><div class="field"><label>Correo</label><input placeholder="empleado@correo.com"></div><div class="field"><label>Rol</label><select><option>Gerente</option><option>Cajero</option><option>Mozo</option><option>Cocina</option></select></div><div class="field"><label>Sucursal</label><select><option>Principal</option><option>California</option></select></div></div>`,'Enviar invitación');break;case'integration-info':toast('Detalle de integración conceptual');break;case'discovery-run':toast('Descubrimiento de demostración: se prepararían fichas con procedencia y confianza');break;case'review-record':openModal('Revisión de ficha',`<p>Verifica nombre, categoría, fuente, fecha de captura, dirección, menú, fotografías y confianza de cada campo.</p><p class="tiny muted">No aprobar automáticamente datos inciertos ni publicar precios sin confirmación del propietario.</p>`,'Marcar como revisada');break;case'add-branch':toast('');break;case'refresh':toast('Datos de demostración actualizados');break;default:toast('Acción disponible en el flujo de demostración');}}
function sendCopilot(){const input=$('#copilot-input');if(!input||!input.value.trim())return;const q=input.value.trim();const box=$('#chat-messages');box.innerHTML+=`<div class="bubble user">${escapeHtml(q)}</div><div class="bubble">Puedo preparar un resumen o borrador para «${escapeHtml(q)}». En el producto conectado consultaría datos autorizados y solicitaría confirmación antes de ejecutar cambios sensibles.</div>`;input.value='';box.scrollTop=box.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}const r=e.target.closest('[data-role]');if(r){setRole(r.dataset.role);return}const a=e.target.closest('[data-action]');if(a){actionHandler(a.dataset.action,a);return}const t=e.target.closest('[data-table]');if(t){const n=t.dataset.table;const seq=['occupied','available','cleaning'];const cur=state.tableStates[n];state.tableStates[n]=seq[(seq.indexOf(cur)+1)%seq.length];render();toast(`Mesa ${n}: ${state.tableStates[n]==='occupied'?'ocupada':state.tableStates[n]==='available'?'disponible':'en limpieza'}`);return}const p=e.target.closest('[data-prompt]');if(p){const input=$('#copilot-input');if(input){input.value=p.dataset.prompt;input.focus()}return}const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.style.borderColor=x===f?'var(--teal)':'');toast(`Filtro: ${state.filter}`)}});
document.addEventListener('change',e=>{if(e.target.id==='role-switch')setRole(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='copilot-input')sendCopilot();if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{if(e.target.matches('[data-rate]')){document.querySelectorAll('[data-rate]').forEach(b=>b.style.opacity='.4');e.target.style.opacity='1'}});
render();
</script>
