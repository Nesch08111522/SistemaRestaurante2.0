
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f0">
    <meta name="robots" content="noindex, nofollow">

    <title>Sin conexión | SmartResto</title>

    <style>
        :root {
            color-scheme: light;

            --offline-bg: #f7f6f0;
            --offline-green: #173b30;
            --offline-accent: #438e6d;
            --offline-muted: #788b89;
            --offline-button: #246d55;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 40px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--offline-bg);
            color: var(--offline-green);
            font-family: "DM Sans", "Manrope", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .offline-page {
            width: 100%;
            max-width: 900px;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* LOGOTIPO */

        .offline-logo {
            display: block;
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 48px;
        }

        /* ETIQUETA */

        .offline-eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            margin-bottom: 28px;

            color: var(--offline-accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .offline-eyebrow::before {
            content: "";
            display: block;
            width: 29px;
            height: 2px;
            background: var(--offline-accent);
        }

        /* TITULAR */

        .offline-title {
            max-width: 900px;
            margin: 0 0 28px;

            color: var(--offline-green);
            font-family: "DM Serif Text", "Lora", Georgia, serif;
            font-size: clamp(3.2rem, 7.1vw, 6.4rem);
            font-weight: 400;
            line-height: 0.99;
            letter-spacing: -0.065em;
        }

        .offline-title span {
            display: block;
        }

        .offline-title em {
            color: var(--offline-accent);
            font-weight: 400;
        }

        /* DESCRIPCIÓN */

        .offline-description {
            max-width: 790px;
            margin: 0 auto 35px;

            color: var(--offline-muted);
            font-size: clamp(1rem, 1.5vw, 1.35rem);
            font-weight: 400;
            line-height: 1.9;
        }

        /* BOTÓN */

        .offline-button {
            display: inline-flex;
            min-height: 66px;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 0 30px;
            border: 1px solid transparent;
            border-radius: 999px;

            background: var(--offline-button);
            color: #ffffff;

            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;

            box-shadow: 0 12px 25px rgba(36, 109, 85, 0.15);

            transition:
                background 180ms ease,
                transform 180ms ease,
                box-shadow 180ms ease;
        }

        .offline-button:hover {
            background: #185940;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(36, 109, 85, 0.2);
        }

        .offline-button:focus-visible {
            outline: 3px solid var(--offline-accent);
            outline-offset: 5px;
        }

        /* RESPONSIVE */

        @media (max-width: 640px) {
            body {
                padding: 35px 22px;
            }

            .offline-logo {
                width: 78px;
                height: 78px;
                margin-bottom: 38px;
            }

            .offline-eyebrow {
                margin-bottom: 25px;
                font-size: 0.76rem;
                letter-spacing: 0.14em;
            }

            .offline-title {
                font-size: clamp(2.8rem, 10vw, 4.1rem);
                line-height: 1.03;
                letter-spacing: -0.055em;
                margin-bottom: 24px;
            }

            .offline-description {
                font-size: 1rem;
                line-height: 1.8;
                margin-bottom: 30px;
            }

            .offline-button {
                min-height: 58px;
                padding: 0 25px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 360px) {
            .offline-title {
                font-size: 2.55rem;
            }

            .offline-eyebrow {
                font-size: 0.68rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="offline-page">

        <img
            class="offline-logo"
            src="{{ url_for('static', filename='assets/img/brand-mark.svg') }}"
            alt="SmartResto"
            width="96"
            height="96"
        >

        <div class="offline-eyebrow">
            Modo sin conexión
        </div>

        <h1 class="offline-title">
            <span>Tu próxima</span>
            <span>experiencia <em>puede</em></span>
            <span><em>esperar.</em></span>
        </h1>

        <p class="offline-description">
            No pudimos conectar con SmartResto. Puedes volver a intentar
            cuando recuperes internet. Los pedidos, pagos y confirmaciones
            necesitan conexión con el servidor.
        </p>

        <a class="offline-button" href="/">
            Volver al inicio <span aria-hidden="true">↗</span>
        </a>

    </main>

</body>
</html>
